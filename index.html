<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decorations -->
    <div class="background">
        <span>❤️</span>
        <span>✨</span>
        <span>💖</span>
        <span>🌸</span>
        <span>💕</span>
        <span>✨</span>
        <span>❤️</span>
    </div>


    <main class="container">

        <section class="card">

            <p class="small-text">
                A special day for a special person ✨
            </p>


            <!-- CHANGE NAME HERE -->
            <h1>
                Happy Birthday,
                <span> Lakshmi </span> 🎂
            </h1>


            <p class="intro">
                I made a little surprise for you ❤️
            </p>


            <!-- CAKE -->
            <div class="cake-area">

                <div class="cake">

                    <div class="candle">

                        <div id="flame"></div>

                    </div>

                    <div class="cake-top"></div>

                    <div class="cake-middle"></div>

                    <div class="cake-bottom"></div>

                </div>

            </div>


            <!-- BUTTON -->
            <button id="surpriseBtn">
                🎁 Open Your Surprise
            </button>


            <!-- SURPRISE -->
            <div id="surpriseContent">


                <!-- PHOTO -->

                <div class="photo-container">

                    <img
                        id="herPhoto"
                        src="images/her-photo.jpg.jpeg"
                        alt="Special memory"
                    >

                </div>


                <!-- TYPING MESSAGE -->

                <div class="message">

                    <h2 id="typingText"></h2>


                    <p id="extraMessage">

                        You deserve all the happiness,
                        smiles and beautiful moments in the world. ✨

                    </p>


                    <div id="heart">
                        ❤️
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- CONFETTI -->

    <canvas id="confetti"></canvas>


    <script src="script.js"></script>

</body>

</html>
